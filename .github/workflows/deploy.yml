name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clear stuck prior Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const id = 'c533e0f049e469bf75f4505c546244400a5f8b93';
            try {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {...context.repo, pages_deployment_id: id});
              core.info('Prior deployment status: ' + result.data.status);
              if (result.data.status) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {...context.repo, pages_deployment_id: id});
                core.info('Cancelled stuck prior deployment.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
